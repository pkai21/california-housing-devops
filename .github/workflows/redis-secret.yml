name: Configure Redis Secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: [self-hosted, khai-server]

    steps:
      - name: Create or update Redis auth secret
        env:
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: |
          set -euo pipefail

          # Secret chưa được tạo trên GitHub thì dừng ngay, tránh tạo Secret rỗng
          # (Redis sẽ chạy với mật khẩu rỗng hoặc lỗi khởi động rất khó đoán nguyên nhân)
          test -n "${REDIS_PASSWORD}"

          kubectl create namespace california-housing \
            --dry-run=client -o yaml | kubectl apply -f -

          # Đưa mật khẩu qua stdin bằng printf '%s' thay vì --from-literal:
          # 1) không lộ mật khẩu trong danh sách tiến trình của runner
          # 2) printf '%s' không thêm ký tự xuống dòng ở cuối. Dùng echo hoặc <<< sẽ
          #    thêm "\n" vào mật khẩu và Redis sẽ từ chối đăng nhập mà không báo lý do rõ ràng
          printf '%s' "${REDIS_PASSWORD}" | kubectl create secret generic redis-auth \
            --namespace california-housing \
            --from-file=password=/dev/stdin \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "Redis auth secret configured."