name: Infrastructure

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: terraform-state
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  terraform:
    # Chạy trên runner đặt tại khai-server
    runs-on: [self-hosted, khai-server]

    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.HCP_TERRAFORM_TOKEN }}
      TF_VAR_kubernetes_host: ${{ secrets.KUBERNETES_HOST }}
      TF_VAR_kubernetes_ca_certificate: ${{ secrets.KUBERNETES_CA_CERTIFICATE }}
      TF_VAR_kubernetes_token: ${{ secrets.KUBERNETES_TOKEN }}
      TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}

    defaults:
      run:
        working-directory: infrastructure/terraform

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - run: terraform fmt -check -recursive
      - run: terraform init -input=false
      - run: terraform validate

      - name: Import existing shared infrastructure
        shell: bash
        run: |
          # Import khi: chưa có trong state VÀ đã tồn tại trong cluster
          # Cluster trống (lần dựng đầu) thì bỏ qua, Terraform sẽ tự tạo mới
          import_ns() {
            terraform state show "kubernetes_namespace.$1" >/dev/null 2>&1 && return 0
            kubectl get namespace "$2" >/dev/null 2>&1 \
              && terraform import "kubernetes_namespace.$1" "$2" \
              || echo "Bỏ qua import namespace $2 (chưa tồn tại)"
          }

          # Helm lưu mỗi release thành Secret có label owner=helm
          import_helm() {
            terraform state show "helm_release.$1" >/dev/null 2>&1 && return 0
            if [ -n "$(kubectl get secret -n "$2" -l "owner=helm,name=$3" -o name 2>/dev/null)" ]; then
              terraform import "helm_release.$1" "$2/$3"
            else
              echo "Bỏ qua import release $3 (chưa tồn tại)"
            fi
          }

          import_ns monitoring monitoring
          import_ns argocd argocd
          import_helm kube_prometheus_stack monitoring monitoring
          import_helm argocd argocd argocd
        
      - name: Terraform Plan
        run: terraform plan -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false