apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: california-housing
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/pkai21/kai-ops.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: california-housing

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true