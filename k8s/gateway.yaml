apiVersion: v1
kind: Service
metadata:
  name: queue-gateway
  namespace: california-housing
spec:
  # ClusterIP: gateway chưa có xác thực nên KHÔNG mở ra ngoài. Test bằng port-forward
  type: ClusterIP
  selector:
    app: queue-gateway
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-gateway
  namespace: california-housing
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: queue-gateway

  template:
    metadata:
      labels:
        app: queue-gateway

    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret

      securityContext:
        runAsNonRoot: true

      containers:
        - name: gateway
          image: ghcr.io/pkai21/california-housing-queue:latest
          imagePullPolicy: Always

          env:
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
            - name: MAX_QUEUE_LEN
              value: "10000"

          ports:
            - containerPort: 8080

          # readiness gọi Redis: Redis chết thì tạm rút gateway khỏi Service
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5

          # liveness KHÔNG gọi Redis: Redis chết mà restart gateway thì chỉ thêm hỗn loạn
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi