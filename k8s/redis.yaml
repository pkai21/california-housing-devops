apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: california-housing
spec:
  # ClusterIP: chỉ pod trong cluster gọi được. KHÔNG dùng NodePort,
  # vì mở Redis ra ngoài là mở toàn bộ hàng đợi cho bất kỳ ai
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379

---
apiVersion: apps/v1
# StatefulSet (không phải Deployment) vì Redis giữ dữ liệu: pod mới khởi động lại
# sẽ được gắn lại đúng ổ đĩa cũ, tên pod cố định là redis-0
kind: StatefulSet
metadata:
  name: redis
  namespace: california-housing
spec:
  serviceName: redis
  replicas: 1

  selector:
    matchLabels:
      app: redis

  template:
    metadata:
      labels:
        app: redis

    spec:
      # Image redis chạy bằng user 999, nhóm 1000. fsGroup để ổ đĩa ghi được bởi user này
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000

      containers:
        - name: redis
          image: redis:7.4-alpine

          args:
            - --requirepass
            - $(REDIS_PASSWORD)      # K8s tự thay bằng giá trị từ env bên dưới
            - --appendonly
            - "yes"                  # ghi mọi thao tác ra đĩa: restart không mất job
            - --appendfsync
            - everysec               # đồng bộ đĩa mỗi giây: cân bằng giữa tốc độ và an toàn
            - --maxmemory
            - 200mb
            - --maxmemory-policy
            - noeviction             # đầy RAM thì TỪ CHỐI ghi mới, không âm thầm xóa job cũ

          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password
            # redis-cli tự đọc biến này để đăng nhập, nên probe và lệnh kubectl exec không cần gõ mật khẩu
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: redis-auth
                  key: password

          ports:
            - name: redis
              containerPort: 6379

          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            # Limit lớn hơn maxmemory (200mb) vì khi Redis rewrite file AOF nó fork tiến trình
            # con và tốn thêm RAM. Để sát 200Mi sẽ bị OOMKilled đúng lúc đang bận
            limits:
              memory: 400Mi

          volumeMounts:
            - name: data
              mountPath: /data

  # Tự tạo ổ đĩa 1Gi cho pod. Cần cluster có StorageClass mặc định (xem bước 1.3)
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi